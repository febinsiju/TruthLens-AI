<!DOCTYPE html>
<html>
<head>
    <title>TruthLens AI</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            margin:0;
            padding:30px;
        }

        h1{
            text-align:center;
            font-size:50px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            margin:20px;
            border-radius:15px;
        }

        .real{
            color:#22c55e;
            font-weight:bold;
        }

        .fake{
            color:#ef4444;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>TruthLens AI</h1>

{% for news in news_results %}

<div class="card">

    <h2>{{ news.title }}</h2>

    {% if news.prediction == "REAL" %}
        <p class="real">
            REAL NEWS
        </p>
    {% else %}
        <p class="fake">
            FAKE NEWS
        </p>
    {% endif %}

    <p>
        Confidence:
        {{ news.confidence }}%
    </p>

    <p>
        {{ news.explanation }}
    </p>

</div>

{% endfor %}

</body>
</html>
